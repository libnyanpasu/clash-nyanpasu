[package]
name = "nyanpasu-traffic-turso"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

# Evaluation SDK dependencies must not enter the application's dependency graph.
[workspace]
resolver = "2"

[dependencies]
nyanpasu-traffic = { path = "../nyanpasu-traffic", default-features = false }
async-trait = "0.1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
turso = { version = "=0.8.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
