[package]
name = 'nyanpasu-profile-io'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
nyanpasu-persistence = { path = '../nyanpasu-persistence', default-features = false }
nyanpasu-paths = { path = '../nyanpasu-paths' }
atomicwrites = '0.4.4'
hex = '0.4'
nanoid = '0.5.0'
serde = { version = '1.0', features = ['derive'] }
yaml_serde = { workspace = true }
sha2 = '0.11'
snafu = { workspace = true }

[dev-dependencies]
serde_json = { version = '1', features = ['preserve_order'] }
tempfile = '3'
