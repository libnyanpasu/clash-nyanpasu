name: '[Single] Upload Release Assets'

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Clash.Nyanpasu-*
          path: ./release-assets
          merge-multiple: false

      - name: Prepare release asset names
        shell: python3 {0}
        run: |
          from pathlib import Path

          root = Path("release-assets")
          for source in sorted(root.glob("**/bundle/nsis-updater/*-setup.exe")):
              target = source.with_name(source.name.removesuffix("-setup.exe") + "-updater.exe")
              if target.exists():
                  raise SystemExit(f"Cannot rename {source}: {target} already exists")
              source.rename(target)
              print(f"Renamed {source} to {target}")

          assets = {}
          for file in sorted(root.rglob("*")):
              if not file.is_file():
                  continue
              if file.name in assets:
                  raise SystemExit(
                      f"Duplicate release asset {file.name}: {assets[file.name]} and {file}"
                  )
              assets[file.name] = file

      - name: Upload to release
        run: |
          find ./release-assets -type f -print0 | while IFS= read -r -d '' file; do
            echo "Uploading $file"
            gh release upload "${{ inputs.tag }}" "$file" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
