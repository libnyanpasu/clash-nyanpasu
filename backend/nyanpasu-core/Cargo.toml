[package]
name = 'nyanpasu-core'
version = '0.1.0'
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config' }
boa_utils = { path = '../boa_utils' }
boa_engine = { workspace = true, features = ['annex-b'] }
boa_runtime = { version = '0.22', default-features = false, features = ['url'] }
dunce = '1.0.5'
mlua = { version = '0.12', features = [
  'lua54',
  'async',
  'serialize',
  'vendored',
  'error-send'
] }
oxc_allocator = '0.153'
oxc_ast = '0.153'
oxc_ast_visit = '0.153'
oxc_parser = '0.153'
oxc_span = '0.153'
oxc_syntax = '0.153'
serde_json = { version = '1', features = ['preserve_order'] }
snafu = { workspace = true }
specta = { version = '^2.0.0-rc.25' }
strum = { version = '0.28', features = ['derive'] }
anyhow = '1'
bon = '3'
arc-swap = '1'
async-trait = '0.1'
dashmap = '6'
indexmap = { version = '2.2.3', features = ['serde'] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde = { version = '1.0', features = ['derive'] }
atomicwrites = '0.4.4'
camino = { version = '1.1.9', features = ['serde1'] }
fs-err = { workspace = true }
serde_yaml_ng = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }
tokio = { workspace = true, features = ['full', 'test-util'] }
tempfile = '3'
# Currently exercised only by the gxhash smoke test below. Every distributed
# target now guarantees hardware AES (see ../../.cargo/config.toml; i686 was
# dropped in #4908), so gxhash can graduate to a normal dependency once the
# default HashMap hasher is migrated to it.
gxhash = { workspace = true }
