[package]
name = 'nyanpasu-rpc-protocol'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
frame-io = ['dep:tokio']
local-client = [
  'frame-io',
  'tokio/net',
  'tokio/rt',
  'tokio/sync',
  'tokio/time',
  'tokio/macros'
]

[dependencies]
snafu = '0.8'
tokio = { version = '1', optional = true, features = ['io-util'] }
serde = { version = '1.0', features = ['derive'] }
serde_json = { version = '1.0', features = ['preserve_order'] }
specta = { version = '^2.0.0-rc.25', features = ['derive'] }
specta-typescript = { version = '0.0.12', features = ['serde'] }

[dev-dependencies]
tokio = { version = '1', features = ['macros', 'rt', 'test-util'] }
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
