[package]
name = "nyanpasu-openapi-p0-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
] }
tower = { version = "=0.5.3", features = ["util"] }
utoipa = { version = "=5.5.0", features = ["axum_extras"] }
utoipa-axum = "=0.2.0"
