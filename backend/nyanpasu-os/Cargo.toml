[package]
name = 'nyanpasu-os'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-support = []
verge-dev = []

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
nyanpasu-paths = { path = '../nyanpasu-paths' }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
anyhow = '1'
async-trait = '0.1.77'
auto-launch = { workspace = true }
camino = '1.1.9'
chacha20poly1305 = { version = '0.11', features = ['zeroize'] }
dunce = '1.0.4'
getrandom = '0.4'
hex = '0.4'
keyring-core = '1.0'
once_cell = '1.19.0'
reqwest = { workspace = true }
runas = { workspace = true }
serde = { version = '1.0', features = ['derive'] }
sha2 = '0.11'
snafu = { workspace = true }
specta = '^2.0.0-rc.25'
sysinfo = '0.39'
sysproxy = { workspace = true }
tempfile = '3.9.0'
tokio = { workspace = true }
tokio-util = '0.7'
tracing = { workspace = true }
url = '2'
whoami = '2.0.0'
zeroize = { version = '1.8', features = ['derive'] }

[target.'cfg(unix)'.dependencies]
libc = '0.2'

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = '1.0', features = [
  'rt-tokio-crypto-rust'
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = '1.0', features = ['keychain'] }

[target.'cfg(windows)'.dependencies]
nyanpasu-utils = { path = '../nyanpasu-runtime/crates/nyanpasu-utils', default-features = false, features = [
  'os'
] }
windows-native-keyring-store = { version = '1.1', default-features = false }
windows-sys = { version = '0.61', features = [
  'Win32_Foundation',
  'Win32_Security',
  'Win32_Security_Authorization',
  'Win32_Storage_FileSystem',
  'Win32_System_SystemServices',
  'Win32_System_Threading',
  'Win32_UI_WindowsAndMessaging'
] }
winreg = { version = '0.56', features = ['transactions'] }

[dev-dependencies]
mockall = '0.15'
futures = '0.3'
serde_json = '1.0'
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false, features = [
  'test-support'
] }
