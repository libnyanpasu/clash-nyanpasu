[package]
name = 'nyanpasu-traffic'
version = '0.1.0'
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Imports the v3 redb statistics file; only the startup that performs the import needs it.
legacy-redb = ['dep:redb']
specta = ['dep:specta']

[dependencies]
serde = { version = '1', features = ['derive'] }
serde_json = '1'
thiserror.workspace = true
tracing.workspace = true
nyanpasu-tsdb = { path = '../nyanpasu-tsdb' }
postcard = { version = '1', default-features = false, features = ['use-std'] }
redb = { version = '4.4.0', optional = true }
specta = { version = '^2.0.0-rc.25', optional = true, features = ['derive'] }

[dev-dependencies]
tempfile = '3'
nyanpasu-tsdb = { path = '../nyanpasu-tsdb', features = ['redb'] }

[[test]]
name = 'legacy_v3'
required-features = ['legacy-redb']
