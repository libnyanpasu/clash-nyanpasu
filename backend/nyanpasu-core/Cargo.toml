[package]
name = 'nyanpasu-core'
version = '0.1.0'
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default-meta = []
default = []
verge-dev = []
test-support = ['dep:mockall']

[dependencies]
nyanpasu-core-manager = { workspace = true }
backon = { version = '1.0.1', features = ['tokio-sleep'] }
redb = '4.0.0'
chrono = { version = '0.4', features = ['serde'] }
time = { version = '0.3', features = ['formatting', 'parsing', 'serde'] }
uuid = '1.7.0'
nyanpasu-macro = { path = '../nyanpasu-macro' }
nyanpasu-widget-protocol = { path = '../nyanpasu-widget-protocol' }
nyanpasu-ipc = { workspace = true }
nyanpasu-utils = { workspace = true, features = ['atomic_fs', 'redb'] }
runas = { workspace = true }
semver = '1.0'
parking_lot = { version = '0.13.0' }
bolt-load = { version = '0.1', default-features = false, features = [
  'tokio',
  'serde',
  'tracing'
] }
smol-cancellation-token = '0.1'
mockall = { version = '0.15', optional = true }
nyanpasu-paths = { path = '../nyanpasu-paths' }
tokio-util = { version = '0.7', features = ['full'] }
ractor = '0.16'
futures = '0.3'
reqwest = { workspace = true }
sysproxy = { workspace = true }
url = '2'
once_cell = '1.19.0'
sha2 = '0.11'
hex = '0.4'
sysinfo = '0.39'
whoami = '2.0.0'
serde_json = { version = '1.0', features = ['preserve_order'] }
tracing-attributes = '0.1'
nyanpasu-config = { path = '../nyanpasu-config' }
specta = { version = '^2.0.0-rc.25' }
snafu = { workspace = true }
strum = { version = '0.28', features = ['derive'] }
anyhow = '1'
bon = '3'
arc-swap = '1'
async-trait = '0.1'
dashmap = '6'
indexmap = { version = '2.2.3', features = ['serde'] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde = { version = '1.0', features = ['derive'] }
atomicwrites = '0.4.4'
camino = { version = '1.1.9', features = ['serde1'] }
fs-err = { workspace = true }
serde_yaml_ng = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { version = '0.56', features = ['transactions'] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = '0.31.0'
tempfile = '3.9.0'

[target.'cfg(not(target_env = "musl"))'.dev-dependencies]
# The desktop AES smoke test does not apply to generic router/musl targets.
# Currently exercised only by the gxhash smoke test below. Every distributed
# target now guarantees hardware AES (see ../../.cargo/config.toml; i686 was
# dropped in #4908), so gxhash can graduate to a normal dependency once the
# default HashMap hasher is migrated to it.
gxhash = { workspace = true }

[dev-dependencies]
pretty_assertions = '1.4.0'
mockall = '0.15'
axum = { version = '0.8', features = ['ws'] }
nyanpasu-paths = { path = '../nyanpasu-paths' }
serde_json = { version = '1', features = ['preserve_order'] }
tokio = { workspace = true, features = ['full', 'test-util'] }
tempfile = '3'
