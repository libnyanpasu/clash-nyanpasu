name: ✨ Feature request
description: Suggest an idea
labels:
  - 'T: Feature'
  - 'S: Untriaged'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this issue. Please write a concise and appropriate title for this issue in the title field, and then fill out the form below step by step.
        _Contents marked with an asterisk (*) are required._

  - type: checkboxes
    id: check
    attributes:
      label: Self-review steps
      description: Review the following items carefully and confirm each one. Issues where the actual situation does not match the required items may be closed.
      options:
        - label: I realize that if I do not carefully review these steps and write the issue description thoroughly, my issue may be closed.
          required: true
        - label: I searched on [Issue list](https://github.com/libnyanpasu/clash-nyanpasu/issues) and [Discussions](https://github.com/libnyanpasu/clash-nyanpasu/discussions), no duplicate or related open contents has been found.
          required: true
        - label: I ensure that this issue contains only one feature topic. If there are multiple topics, I will create separate issues for each one.
          required: true
        - label: I read and understood the contents of [Q&A Convention](https://nyanpasu.org/others/issues/) and [FAQ](https://nyanpasu.org/others/faq/).
          required: true
        - label: I tried the latest Beta / Nightly version, but this feature has not been implemented.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/libnyanpasu/clash-nyanpasu/blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: I want to submit a pull request to resolve this issue.
          required: false

  - type: textarea
    id: request
    attributes:
      label: Requirement
      description: Describe what you need here.
      placeholder: I want ABC feature ...
    validations:
      required: true

  - type: textarea
    id: impl
    attributes:
      label: Suggested implements
      description: Describe your suggested implements here. It’s recommend to attach a image in “Addition details” section if you are making a UI feature request.
      placeholder: I recommend add ABC feature to DEF ...
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Additional details
      description: Describe additional details here.
      placeholder: Additional details and attachments, such as screenshots, videos, etc.
    validations:
      required: false
