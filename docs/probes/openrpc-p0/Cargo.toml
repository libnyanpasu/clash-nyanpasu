[package]
name = "nyanpasu-openrpc-p0-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
jsonrpsee = { version = "=0.26.0", default-features = false, features = [
  "server-core",
] }
jsonrpsee-types = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
