[package]
name = 'nyanpasu-tsdb'
version = '0.1.0'
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The redb backend (design §3.4). The port, the core and the in-memory backend
# build without it.
redb = []

[dependencies]
crc32fast = '1'
# The schema fingerprint is the hash of the schema's postcard encoding, whose wire
# format is specified and stable (schema.rs).
postcard = { version = '1.1', default-features = false, features = ['use-std'] }
serde = { version = '1', features = ['derive'] }
snafu.workspace = true
# Derives the stored tags of enums, and the lists of their variants.
strum = { version = '0.28', features = ['derive'] }
zerocopy = '0.8'
zstd = '0.14'

[dev-dependencies]
proptest = { version = '1', default-features = false, features = ['std'] }
