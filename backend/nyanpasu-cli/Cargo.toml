[package]
name = 'nyanpasu-cli'
version = '0.1.0'
description = 'Command-line client of a running Clash Nyanpasu shell'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = 'nyanpasu_cli'
path = 'src/lib.rs'

[[bin]]
name = 'nyanpasu-cli'
path = 'src/main.rs'

# Production dependencies stay on the wire and transport layer: no protocol, core
# family, implementation, RPC adapter, server or GUI package
# (`pnpm run lint:backend-boundaries`).
[dependencies]
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
nyanpasu-paths = { path = '../nyanpasu-paths' }
nyanpasu-rpc-wire = { path = '../nyanpasu-rpc-wire', features = ['local-client'] }
nyanpasu-single-instance = { path = '../nyanpasu-single-instance' }
clap = { version = '4', features = ['derive', 'env'] }
clap_complete = '4'
dirs = '7'
keyring = '4'
# `query` is optional in reqwest 0.13 and no other dependency of this package turns it on, so
# the sidecar build (`cargo build -p nyanpasu-cli`, without dev-dependencies) needs it.
reqwest = { workspace = true, features = ['query'] }
rustls = '0.23'
serde = { version = '1', features = ['derive'] }
serde_json = '1'
snafu = { workspace = true }
tokio = { workspace = true }
toml = '1'
uuid = { version = '1', features = ['v4'] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = '0.61', features = [
  'Win32_Foundation',
  'Win32_Security',
  'Win32_Security_Authorization',
  'Win32_System_Threading',
] }

[build-dependencies]
serde_json = '1'

[dev-dependencies]
# Pins the CLI's wire names for shared events against their owner. `nyanpasu-rpc` with
# its test support serves a real core to `tests/core_rpc.rs` without entering the
# production `[dependencies]`.
nyanpasu-rpc = { path = '../nyanpasu-rpc', features = [
  'http',
  'local-server',
  'test-support'
] }
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
nyanpasu-rpc-protocol = { path = '../nyanpasu-rpc-protocol', default-features = false }
tempfile = '3'
# `start_paused` for the bounded waits of the MCP server.
tokio = { workspace = true, features = ['test-util'] }
tokio-util = '0.7'
