[package]
name = 'nyanpasu-profile-transform'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-support = []

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
indexmap = { version = '2.2.3', features = ['serde'] }
serde = { version = '1.0', features = ['derive', 'rc'] }
yaml_serde = { workspace = true }
snafu = { workspace = true }
specta = { version = '^2.0.0-rc.25', features = ['indexmap'] }

[dev-dependencies]
boa_utils = { path = '../boa_utils' }
boa_engine = { workspace = true, features = ['annex-b'] }
mlua = { version = '0.12', features = [
  'lua54',
  'async',
  'serialize',
  'vendored',
  'error-send'
] }
async-trait = '0.1'
url = '2'
nyanpasu-config = { path = '../nyanpasu-config', default-features = false }
nyanpasu-scripts = { path = '../nyanpasu-scripts', default-features = false, features = [
  'javascript',
  'lua'
] }
tempfile = '3'
serde_json = { version = '1', features = ['preserve_order'] }
