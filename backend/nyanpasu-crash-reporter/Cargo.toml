[package]
name = 'nyanpasu-crash-reporter'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
slint = { version = '=1.18.1', default-features = false, features = [
  'std',
  'compat-1-2',
  'renderer-software',
] }
# Use the backend directly: Slint's selector enables muda 0.19, whose
# Objective-C classes clash with Tauri's muda 0.20 on macOS. Internal Slint
# crates only stay compatible within a release, hence the exact pin.
i-slint-backend-winit = { version = '=1.18.1', default-features = false, features = [
  'renderer-software',
] }
# The version and features Slint's winit backend already links.
arboard = { version = '3.6', default-features = false }
# The version Slint resolves system fonts with, to pick the monospace family.
fontique = '0.11.1'
serde = { version = '1', features = ['derive'] }
open = '5'
snafu = { workspace = true }
url = '2'

# The opaque window needs no GL renderer on Linux either.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
i-slint-backend-winit = { version = '=1.18.1', default-features = false, features = [
  'x11',
  'wayland',
] }

[dev-dependencies]
serde_json = '1'

[build-dependencies]
slint-build = { version = '=1.18.1', default-features = false, features = [
  'compat-1-18',
] }
