[package]
name = "log-index-research"
version = "0.0.0"
edition = "2024"

[dependencies]
gxhash = "=3.5.0"
nyanpasu-logging = { path = "../../backend/nyanpasu-runtime/crates/nyanpasu-logging" }
anyhow = { version = "=1.0.104", features = [] }
bumpalo = { version = "=3.20.3", features = [] }
camino = { version = "=1.2.5", features = ["serde1"] }
chrono = { version = "=0.4.45", features = ["serde"] }
derive_builder = { version = "=0.20.2", features = [] }
itertools = { version = "=0.15.0", features = [] }
rustc-hash = { version = "=2.1.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = [] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "rt"] }
tracing = { version = "=0.1.44", features = [] }
tempfile = { version = "=3.27.0", features = [] }
pretty_assertions = { version = "=1.4.1", features = [] }
self_cell = "=1.3.0"
lasso = "=0.7.3"
smol_str = "=0.3.6"
string-interner = "=0.20.0"

[workspace]

[features]
alloc-stats = []

[profile.release]
codegen-units = 1
