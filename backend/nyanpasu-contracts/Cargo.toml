[package]
name = 'nyanpasu-contracts'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-support = ['dep:mockall']

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }

async-trait = '0.1'
mockall = { version = '0.15', optional = true }
serde = { version = '1.0', features = ['derive'] }
snafu = { workspace = true }
specta = { version = '^2.0.0-rc.25' }
url = '2'

[dev-dependencies]
mockall = '0.15'
