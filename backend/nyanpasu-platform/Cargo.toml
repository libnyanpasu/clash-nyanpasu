[package]
name = 'nyanpasu-platform'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = 'nyanpasu_platform'

[features]
test-support = ['nyanpasu-core/test-support', 'dep:tempfile']

[dependencies]
nyanpasu-core = { path = '../nyanpasu-core' }
nyanpasu-paths = { path = '../nyanpasu-paths' }
nyanpasu-core-manager = { workspace = true }
nyanpasu-config = { path = '../nyanpasu-config' }
boa_utils = { path = '../boa_utils' }
nyanpasu-log-preview = { workspace = true }

atomicwrites = '0.4.4'
backon = { version = '1.0.1', features = ['tokio-sleep'] }
base64 = '0.23'
hex = '0.4'
nanoid = '0.5.0'
percent-encoding = '2.3.1'
reqwest = { workspace = true }
serde = { version = '1.0', features = ['derive', 'rc'] }
sha2 = '0.11'
snafu = { workspace = true }
sysproxy = { workspace = true }
tempfile = { version = '3', optional = true }
time = { version = '0.3', features = ['formatting', 'parsing', 'serde'] }
url = '2'
anyhow = '1'
async-trait = '0.1'
boa_engine = { workspace = true, features = ['annex-b'] }
boa_runtime = { version = '0.22', default-features = false, features = ['url'] }
dunce = '1.0.5'
indexmap = { version = '2.2.3', features = ['serde'] }
mlua = { version = '0.12', features = [
  'lua54',
  'async',
  'serialize',
  'vendored',
  'error-send'
] }
oxc_allocator = '0.156'
oxc_ast = '0.156'
oxc_ast_visit = '0.156'
oxc_parser = '0.156'
oxc_span = '0.156'
oxc_syntax = '0.156'
serde_json = { version = '1', features = ['preserve_order'] }
serde_yaml = { version = '0.10', package = 'serde_yaml_ng', git = 'https://github.com/libnyanpasu/serde-yaml-ng.git', rev = '363da138dc97f90ef0a356f971c2dc1d8fe04c9e', features = [
  'specta'
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ['full'] }
tracing = { workspace = true }

[dev-dependencies]
nyanpasu-core = { path = '../nyanpasu-core', features = ['test-support'] }
nyanpasu-ipc = { workspace = true }
nyanpasu-logging = { path = '../nyanpasu-runtime/crates/nyanpasu-logging', features = [
  'specta'
] }
axum = { version = '0.8', features = ['ws'] }
camino = { version = '1.1.9', features = ['serde1'] }
futures-util = '0.3'
tokio-util = { version = '0.7', features = ['full'] }
tempfile = '3'
test-log = { workspace = true }
