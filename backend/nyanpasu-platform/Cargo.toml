[package]
name = 'nyanpasu-platform'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = 'nyanpasu_platform'

[dependencies]
nyanpasu-core-manager = { workspace = true }
nyanpasu-ipc = { workspace = true }
nyanpasu-utils = { workspace = true }
clash-api = { workspace = true }
futures = '0.3'
futures-util = '0.3'
uuid = { version = '1', features = ['v4', 'serde'] }
nyanpasu-core = { path = '../nyanpasu-core' }
camino = '1'
nyanpasu-application = { path = '../nyanpasu-application' }
nyanpasu-config = { path = '../nyanpasu-config' }
boa_utils = { path = '../boa_utils' }

anyhow = '1'
async-trait = '0.1'
boa_engine = { workspace = true, features = ['annex-b'] }
boa_runtime = { version = '0.22', default-features = false, features = ['url'] }
dunce = '1.0.5'
indexmap = { version = '2.2.3', features = ['serde'] }
mlua = { version = '0.12', features = [
  'lua54',
  'async',
  'serialize',
  'vendored',
  'error-send'
] }
oxc_allocator = '0.153'
oxc_ast = '0.153'
oxc_ast_visit = '0.153'
oxc_parser = '0.153'
oxc_span = '0.153'
oxc_syntax = '0.153'
serde_json = { version = '1', features = ['preserve_order'] }
serde_yaml = { version = '0.10', package = 'serde_yaml_ng', git = 'https://github.com/libnyanpasu/serde-yaml-ng.git', rev = '363da138dc97f90ef0a356f971c2dc1d8fe04c9e', features = [
  'specta'
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ['full'] }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { version = '0.3', features = ['fmt', 'json'] }
axum = { version = '0.8', features = ['ws'] }
tempfile = '3'
test-log = { workspace = true }
