name: '[Release] Prepare Version and Draft Release'

on:
  workflow_dispatch:
    inputs:
      versionType:
        type: choice
        description: '<major|minor|patch|premajor|preminor|prepatch|prerelease>'
        required: true
        default: 'patch'
        options:
          - major
          - minor
          - patch
          - premajor
          - preminor
          - prepatch
          - prerelease
      preid:
        type: choice
        description: 'Prerelease identifier, used by pre* version types'
        required: true
        default: 'beta'
        options:
          - beta
          - rc

jobs:
  publish:
    name: Publish ${{ inputs.versionType }} release
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      discussions: write
    runs-on: ubuntu-latest
    steps:
      # The RequireCI ruleset rejects GITHUB_TOKEN pushes to main; the release
      # app is its bypass actor.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Prepare Node
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install
        run: pnpm i

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test release versioning
        run: deno task test:release

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - id: update-version
        shell: bash
        name: Bump version
        # Use npm because yarn is for some reason not able to output only the version name
        run: |
          VERSION=$(pnpm run publish ${{ inputs.versionType }} ${{ inputs.preid }} | tail -n1)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          git add .

      - name: Generate a changelog for the new version
        shell: bash
        id: build-changelog
        run: |
          set -eo pipefail
          # CHANGELOG.md keeps one section per tag, prereleases included: the
          # in-app updater joins the sections between the installed and the
          # offered version, so a section must not repeat an earlier one.
          git-cliff --config cliff.toml --verbose --strip header --unreleased --tag v${{ steps.update-version.outputs.version }} > /tmp/changelog-section.md
          cat /tmp/changelog-section.md ./CHANGELOG.md > temp && mv temp ./CHANGELOG.md
          pnpm exec prettier --write ./CHANGELOG.md
          cp /tmp/changelog-section.md /tmp/changelog.md
          # A stable release body lists every change since the previous stable
          # one, folding in the commits of the prereleases leading up to it.
          if [ '${{ steps.update-version.outputs.prerelease }}' = 'false' ]; then
            LAST_STABLE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD)
            git-cliff --config cliff.toml --verbose --strip header --ignore-tags 'v.*-.*' --tag v${{ steps.update-version.outputs.version }} "$LAST_STABLE..HEAD" > /tmp/changelog.md
          fi
          if [ -s /tmp/changelog.md ]; then
            CONTENT=$(cat /tmp/changelog.md)
            {
              echo 'content<<EOF'
              echo "$CONTENT"
              echo EOF
            } >> $GITHUB_OUTPUT
            echo "version=${{ steps.update-version.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "Failed to generate changelog"
            exit 1
          fi
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub rejects git pushes from the release app with 403 while its API
      # writes succeed, so the bump commit and its tag are created through the
      # API. lint-staged stands in for the pre-commit hook a local commit runs.
      - name: Commit changes
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.update-version.outputs.version }}
        run: |
          set -euo pipefail
          git add -A
          pnpm exec lint-staged
          git diff --cached --name-only -z | while IFS= read -r -d '' path; do
            jq -n --arg path "$path" --rawfile contents <(base64 -w0 "$path") \
              '{path: $path, contents: $contents}'
          done | jq -s . > /tmp/additions.json
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$(git rev-parse HEAD)" \
            --arg headline "chore: bump version to v$VERSION" \
            --slurpfile additions /tmp/additions.json \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: $additions[0]}
              }}
            }' > /tmp/commit.json
          COMMIT_SHA=$(gh api graphql --input /tmp/commit.json --jq '.data.createCommitOnBranch.commit.oid')
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION" -f message="v$VERSION" -f object="$COMMIT_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$TAG_SHA" --silent
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.update-version.outputs.prerelease }}
          body: ${{steps.build-changelog.outputs.content}}
          name: Clash Nyanpasu v${{steps.update-version.outputs.version}}
          tag_name: 'v${{ steps.update-version.outputs.version }}'
          target_commitish: ${{ steps.commit.outputs.sha }}
