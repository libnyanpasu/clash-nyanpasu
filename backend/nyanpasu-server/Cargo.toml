[package]
name = 'nyanpasu-server'
version = '0.1.0'
edition.workspace = true
license.workspace = true
authors.workspace = true
description = 'Headless shell: composes the shared application without a GUI'

[dependencies]
nyanpasu-core = { path = '../nyanpasu-core', default-features = false, features = [
  'default-meta',
  'nesting'
] }
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
nyanpasu-migration = { path = '../nyanpasu-migration', default-features = false }
nyanpasu-net = { path = '../nyanpasu-net', default-features = false }
nyanpasu-paths = { path = '../nyanpasu-paths' }
nyanpasu-profile-io = { path = '../nyanpasu-profile-io', default-features = false }
nyanpasu-scripts = { path = '../nyanpasu-scripts' }
nyanpasu-jobs = { path = '../nyanpasu-runtime/crates/nyanpasu-jobs', features = [
  'specta'
] }
nyanpasu-logging = { path = '../nyanpasu-runtime/crates/nyanpasu-logging', features = [
  'specta'
] }
nyanpasu-ipc = { workspace = true }
nyanpasu-utils = { workspace = true, features = ['atomic_fs', 'redb'] }
anyhow = '1'
async-trait = '0.1'
camino = '1.1.9'
serde = '1'
serde_json = '1'
snafu = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = '0.7', features = ['full'] }
tracing = { workspace = true }
tracing-subscriber = { version = '0.3', features = ['env-filter'] }
