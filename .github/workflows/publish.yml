name: '[Release] Prepare Version and Draft Release'

on:
  workflow_dispatch:
    inputs:
      versionType:
        type: choice
        description: '<major|minor|patch|premajor|preminor|prepatch|prerelease>'
        required: true
        default: 'patch'
        options:
          - major
          - minor
          - patch
          - premajor
          - preminor
          - prepatch
          - prerelease
      preid:
        type: choice
        description: 'Prerelease identifier, used by pre* version types'
        required: true
        default: 'beta'
        options:
          - beta
          - rc

jobs:
  publish:
    name: Publish ${{ inputs.versionType }} release
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      discussions: write
    runs-on: ubuntu-latest
    steps:
      # The RequireCI ruleset rejects GITHUB_TOKEN pushes to main; the release
      # app is its bypass actor.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Prepare Node
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install
        run: pnpm i

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test release versioning
        run: deno task test:release

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - id: update-version
        shell: bash
        name: Bump version
        # Use npm because yarn is for some reason not able to output only the version name
        run: |
          VERSION=$(pnpm run publish ${{ inputs.versionType }} ${{ inputs.preid }} | tail -n1)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Prereleases feed the beta updater channel and stay out of CHANGELOG.md.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          git add .

      - name: Generate a changelog for the new version
        shell: bash
        id: build-changelog
        run: |
          touch /tmp/changelog.md
          # A stable release lists every change since the previous stable one,
          # folding in the commits of the prereleases leading up to it.
          CLIFF_ARGS=(--unreleased)
          if [ '${{ steps.update-version.outputs.prerelease }}' = 'false' ]; then
            LAST_STABLE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD)
            CLIFF_ARGS=(--ignore-tags 'v.*-.*' "$LAST_STABLE..HEAD")
          fi
          git-cliff --config  cliff.toml --verbose --strip header "${CLIFF_ARGS[@]}" --tag v${{ steps.update-version.outputs.version }} > /tmp/changelog.md
          if [ $? -eq 0 ]; then
            CONTENT=$(cat /tmp/changelog.md)
            if [ '${{ steps.update-version.outputs.prerelease }}' = 'false' ]; then
              cat /tmp/changelog.md | cat - ./CHANGELOG.md > temp && mv temp ./CHANGELOG.md
            fi
            {
              echo 'content<<EOF'
              echo "$CONTENT"
              echo EOF
            } >> $GITHUB_OUTPUT
            echo "version=${{ steps.update-version.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "Failed to generate changelog"
            exit 1
          fi
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: bump version to v${{ steps.update-version.outputs.version }}'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          tagging_message: 'v${{ steps.update-version.outputs.version }}'

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.update-version.outputs.prerelease }}
          body: ${{steps.build-changelog.outputs.content}}
          name: Clash Nyanpasu v${{steps.update-version.outputs.version}}
          tag_name: 'v${{ steps.update-version.outputs.version }}'
          # target_commitish: ${{ steps.tag.outputs.sha }}
