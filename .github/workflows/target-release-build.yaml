name: '[Release] Build and Publish Release Packages'

on:
  release:
    types: [published]

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  storage_preflight:
    name: Check Storage Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check configured storage before package builds
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        continue-on-error: true
        run: deno task storage:preflight
        env:
          SOURCEFORGE_PROJECT: ${{ vars.SOURCEFORGE_PROJECT }}
          SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME || secrets.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_KNOWN_HOSTS: ${{ secrets.SOURCEFORGE_KNOWN_HOSTS }}

  windows_build:
    name: Windows Build
    needs: [storage_preflight]
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: false
      bundle-type: 'both'
      arch: 'x86_64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  windows_aarch64_build:
    name: Windows aarch64 Build
    needs: [storage_preflight]
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: false
      bundle-type: 'both'
      arch: 'aarch64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  linux_build:
    name: Linux Build
    needs: [storage_preflight]
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: false
      arch: 'x86_64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  linux_aarch64_build:
    name: Linux aarch64 Build
    needs: [storage_preflight]
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: false
      arch: 'aarch64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  macos_amd64_build:
    name: macOS amd64 Build
    needs: [storage_preflight]
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: false
      aarch64: false
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  macos_aarch64_build:
    name: macOS aarch64 Build
    needs: [storage_preflight]
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: false
      aarch64: true
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  publish_storage:
    name: Prepare Complete Storage Inventory
    needs:
      [
        windows_build,
        windows_aarch64_build,
        linux_build,
        linux_aarch64_build,
        macos_amd64_build,
        macos_aarch64_build,
      ]
    uses: ./.github/workflows/deps-publish-storage.yaml
    with:
      backend: prepare
      nightly: false
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  publish_sourceforge:
    name: Publish SourceForge Mirror
    needs: [publish_storage]
    if: ${{ needs.publish_storage.outputs.publication_prepared == 'true' && vars.SOURCEFORGE_PROJECT != '' }}
    uses: ./.github/workflows/deps-publish-storage.yaml
    with:
      backend: sourceforge
      published_at: ${{ needs.publish_storage.outputs.published_at }}
      nightly: false
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  upload_release_assets:
    name: Upload Release Assets
    needs:
      [
        windows_build,
        windows_aarch64_build,
        linux_build,
        linux_aarch64_build,
        macos_amd64_build,
        macos_aarch64_build,
      ]
    uses: ./.github/workflows/deps-upload-release-assets.yaml
    with:
      tag: ${{ github.event.release.tag_name }}

  updater:
    name: Create Updater
    needs: [upload_release_assets]
    uses: ./.github/workflows/deps-create-updater.yaml
    with:
      nightly: false
    secrets: inherit

  updater_sourceforge:
    name: Publish Verified SourceForge Updater
    needs: [updater, verify_sourceforge]
    if: ${{ !cancelled() && needs.updater.result == 'success' && needs.verify_sourceforge.result == 'success' && needs.verify_sourceforge.outputs.sourceforge_mirrors_json != '' }}
    uses: ./.github/workflows/deps-create-updater.yaml
    with:
      nightly: false
      sourceforge_mirrors_json: ${{ needs.verify_sourceforge.outputs.sourceforge_mirrors_json }}
    secrets: inherit

  telegram:
    name: Publish Files to Telegram
    if: ${{ startsWith(github.repository, 'libnyanpasu') && needs.publish_storage.outputs.publication_prepared == 'true' }}
    needs: [publish_storage]
    uses: ./.github/workflows/deps-publish-storage.yaml
    with:
      backend: telegram
      published_at: ${{ needs.publish_storage.outputs.published_at }}
      nightly: false
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  verify_sourceforge:
    name: Verify SourceForge Mirror
    if: ${{ always() && (vars.SOURCEFORGE_PROJECT == '' || needs.publish_storage.outputs.publication_prepared == 'true') }}
    needs: [publish_storage, publish_sourceforge]
    runs-on: ubuntu-latest
    outputs:
      sourceforge_mirrors_json: ${{ steps.verify.outputs.sourceforge_mirrors_json }}
    steps:
      - name: Checkout repository
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: actions/checkout@v7
      - name: Install Deno
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Download target publication reports
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: actions/download-artifact@v8
        with:
          name: publication-reports-sourceforge
          path: ./publication-reports
          merge-multiple: false
      - name: Verify complete mirror and public hashes
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        id: verify
        run: >-
          deno task sourceforge:verify ./publication-reports ./sourceforge-mirrors.json release
          windows-x86_64,windows-aarch64,linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64
      - name: Preserve verified mirror manifest
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sourceforge-verified-mirrors
          path: ./sourceforge-mirrors.json
          if-no-files-found: error
