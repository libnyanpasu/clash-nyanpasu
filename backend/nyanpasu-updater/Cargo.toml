[package]
name = 'nyanpasu-updater'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-support = []

[dependencies]
nyanpasu-owner-support = { path = '../nyanpasu-owner-support', default-features = false }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
nyanpasu-config = { path = '../nyanpasu-config', default-features = false }
nyanpasu-paths = { path = '../nyanpasu-paths' }
anyhow = '1'
async-trait = '0.1'
bolt-load = { version = '0.1', default-features = false, features = [
  'tokio',
  'serde',
  'tracing'
] }
flate2 = '1.0'
futures = '0.3'
hex = '0.4'
parking_lot = { version = '0.13.0' }
ractor = '0.16'
reqwest.workspace = true
semver = '1.0'
serde = { version = '1.0', features = ['derive'] }
sha2 = '0.11'
smol-cancellation-token = '0.1'
snafu.workspace = true
specta = '^2.0.0-rc.25'
tar = '0.4'
tempfile = '3.9.0'
tokio.workspace = true
tokio-util = { version = '0.7', features = ['rt'] }
tracing.workspace = true
url = '2'
zip = '9.0.0'

[dev-dependencies]
axum = { version = '0.8', features = ['ws'] }
camino = { version = '1.1.9', features = ['serde1'] }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false, features = [
  'test-support'
] }
tokio = { workspace = true, features = ['full', 'test-util'] }
