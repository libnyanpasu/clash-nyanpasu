[package]
name = "nyanpasu-jobs-p0-probe"
version = "0.0.0"
edition = "2024"
publish = false

# An isolated executable specification, not a production workspace member.
[workspace]

[dev-dependencies]
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
croner = "=4.0.0"
redb = "=4.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "test-util",
] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["registry"] }
