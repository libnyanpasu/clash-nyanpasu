[package]
name = 'nyanpasu-migration'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ['default-meta']
default-meta = ['nyanpasu-config/default-meta']
test-support = []

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config', default-features = false }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
nyanpasu-persistence = { path = '../nyanpasu-persistence', default-features = false }
nyanpasu-paths = { path = '../nyanpasu-paths' }
nyanpasu-utils = { path = '../nyanpasu-runtime/crates/nyanpasu-utils', default-features = false, features = [
  'serde'
] }
nyanpasu-macro = { path = '../nyanpasu-macro' }
anyhow = '1'
camino = '1.1.9'
chrono = '0.4'
fs-err.workspace = true
once_cell = '1.19.0'
semver = { version = '1.0', features = ['serde'] }
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
serde_yaml_ng.workspace = true
snafu.workspace = true
thiserror.workspace = true
time = '0.3'
tracing.workspace = true
uuid = { version = '1.7.0', features = ['v4'] }

[dev-dependencies]
pretty_assertions = '1.4.0'
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false, features = [
  'test-support'
] }
tempfile = '3'
