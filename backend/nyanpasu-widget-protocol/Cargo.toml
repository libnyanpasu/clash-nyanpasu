[package]
name = 'nyanpasu-widget-protocol'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The widget's end of the channel to the application. Crates that only need
# the message and variant types, such as nyanpasu-config, leave it off.
ipc = ['dep:nyanpasu-local-channel', 'dep:snafu']
# The application's end as well. It needs nyanpasu-local-channel's Tokio
# server, which the widget, a blocking client, does not link.
ipc-host = ['ipc', 'nyanpasu-local-channel/tokio']

[dependencies]
clap = { version = '4', features = ['derive'] }
serde = { version = '1', features = ['derive'] }
specta = { version = '^2.0.0-rc.25', features = ['derive'] }
nyanpasu-log-preview = { workspace = true }
nyanpasu-local-channel = { path = '../nyanpasu-local-channel', optional = true }
snafu = { workspace = true, optional = true }

[dev-dependencies]
serde_json = '1'
# The encoding nyanpasu-local-channel puts on the wire, to pin the message
# layout.
postcard = { version = '1.1', default-features = false, features = ['use-std'] }
tokio = { workspace = true }
