[package]
name = 'nyanpasu-rpc-wire'
version = '0.1.0'
description = 'Dependency-light wire layer of the local RPC: frames, raw local client, error envelope and describe response'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
frame-io = ['dep:tokio']
local-client = [
  'frame-io',
  'tokio/net',
  'tokio/rt',
  'tokio/sync',
  'tokio/time',
  'tokio/macros'
]

[dependencies]
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
snafu = { workspace = true }
tokio = { version = '1', optional = true, features = ['io-util'] }
serde = { version = '1.0', features = ['derive'] }
serde_json = { version = '1.0', features = ['preserve_order'] }
specta = { version = '^2.0.0-rc.28', features = ['derive'] }

[dev-dependencies]
tokio = { version = '1', features = ['macros', 'rt', 'test-util'] }
