name: '[Release] Build and Publish Release Packages'

on:
  release:
    types: [published]

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  windows_build:
    name: Windows Build
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: false
      bundle-type: 'both'
      arch: 'x86_64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  windows_aarch64_build:
    name: Windows aarch64 Build
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: false
      bundle-type: 'both'
      arch: 'aarch64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  linux_build:
    name: Linux Build
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: false
      arch: 'x86_64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  linux_aarch64_build:
    name: Linux aarch64 Build
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: false
      arch: 'aarch64'
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  macos_amd64_build:
    name: macOS amd64 Build
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: false
      aarch64: false
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  macos_aarch64_build:
    name: macOS aarch64 Build
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: false
      aarch64: true
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  upload_release_assets:
    name: Upload Release Assets
    needs:
      [
        windows_build,
        windows_aarch64_build,
        linux_build,
        linux_aarch64_build,
        macos_amd64_build,
        macos_aarch64_build,
      ]
    uses: ./.github/workflows/deps-upload-release-assets.yaml
    with:
      tag: ${{ github.event.release.tag_name }}

  updater:
    name: Create Updater
    needs: [upload_release_assets]
    uses: ./.github/workflows/deps-create-updater.yaml
    with:
      nightly: false
    secrets: inherit

  telegram:
    name: Send Release Message to Telegram
    if: startsWith(github.repository, 'libnyanpasu')
    needs: [upload_release_assets]
    uses: ./.github/workflows/deps-message-telegram.yaml
    with:
      nightly: false
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  verify_archive_uploads:
    name: Verify Archive Uploads
    # Resume this gate together with the package archive upload steps.
    if: ${{ false && always() }}
    needs:
      [
        windows_build,
        windows_aarch64_build,
        linux_build,
        linux_aarch64_build,
        macos_amd64_build,
        macos_aarch64_build,
      ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Download upload diagnostics
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: upload-diagnostics-*
          path: ./upload-diagnostics
          merge-multiple: false

      - name: Verify archive uploads
        run: deno task verify:archive-uploads ./upload-diagnostics
