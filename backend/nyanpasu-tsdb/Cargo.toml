[package]
name = 'nyanpasu-tsdb'
version = '0.1.0'
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# --smoke belongs to the standalone benchmark, not libtest.
bench = false

[features]
# The redb backend (design §3.4). The port, the core and the in-memory backend
# build without it.
redb = ['dep:redb']

[dependencies]
crc32fast = '1'
# The schema fingerprint is the hash of the schema's postcard encoding, whose wire
# format is specified and stable (schema.rs).
postcard = { version = '1.1', default-features = false, features = ['use-std'] }
# 4.4 is the version whose commit, close and I/O-failure semantics the design
# was checked against (design §3.2, §7.5).
redb = { version = '4.4.0', optional = true }
rustc-hash = '2'
serde = { version = '1', features = ['derive'] }
snafu.workspace = true
# Derives the stored tags of enums, and the lists of their variants.
strum = { version = '0.28', features = ['derive'] }
# Recognizes and restores canonical UUIDs in identity columns (§11.1).
uuid = { version = '1', default-features = false }
zerocopy = '0.8'
zstd = '0.14'

[dev-dependencies]
proptest = { version = '1', default-features = false, features = ['std'] }
tempfile = '3'

[[bench]]
name = 'tsdb'
harness = false
