name: '[Release] Build and Publish Nightly'

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # 每天 08:15 UTC+8 自动构建

concurrency:
  group: dev-build
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  check_changes:
    name: Check Nightly Changes
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.repository, 'libnyanpasu') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check changes since previous nightly
        id: changes
        run: deno task check:nightly-changes

      - name: Check configured storage before package builds
        if: ${{ steps.changes.outputs.should_build == 'true' && (vars.IA_ITEM_PREFIX != '' || vars.SOURCEFORGE_PROJECT != '') }}
        run: deno task storage:preflight
        env:
          SOURCEFORGE_PROJECT: ${{ vars.SOURCEFORGE_PROJECT }}
          SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME || secrets.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_KNOWN_HOSTS: ${{ secrets.SOURCEFORGE_KNOWN_HOSTS }}
          IA_ITEM_PREFIX: ${{ vars.IA_ITEM_PREFIX }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_UPLOADER: ${{ secrets.IA_UPLOADER }}
          ARCHIVE_UPLOAD_TOKEN: ${{ secrets.ARCHIVE_UPLOAD_TOKEN }}
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}

  windows_amd64_build:
    name: Windows x86_64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: true
      bundle-type: 'both'
      arch: 'x86_64'
      tag: 'pre-release'
    secrets: inherit

  windows_aarch64_build:
    name: Windows aarch64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: true
      nightly: true
      bundle-type: 'both'
      arch: 'aarch64'
      tag: 'pre-release'
    secrets: inherit

  linux_amd64_build:
    name: Linux amd64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: true
      tag: 'pre-release'
      arch: 'x86_64'
    secrets: inherit

  linux_aarch64_build:
    name: Linux aarch64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: true
      tag: 'pre-release'
      arch: 'aarch64'
    secrets: inherit

  macos_amd64_build:
    name: macOS amd64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: true
      aarch64: false
      tag: 'pre-release'
    secrets: inherit

  macos_aarch64_build:
    name: macOS aarch64 Build
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: true
      aarch64: true
      tag: 'pre-release'
    secrets: inherit

  publish_storage:
    name: Publish Complete Build to Archive and Mirrors
    needs:
      [
        windows_amd64_build,
        windows_aarch64_build,
        linux_amd64_build,
        linux_aarch64_build,
        macos_amd64_build,
        macos_aarch64_build,
      ]
    uses: ./.github/workflows/deps-publish-storage.yaml
    with:
      nightly: true
      tag: 'pre-release'
    secrets: inherit

  update_tag:
    name: Update tag
    needs:
      [
        windows_amd64_build,
        windows_aarch64_build,
        linux_amd64_build,
        linux_aarch64_build,
        macos_amd64_build,
        macos_aarch64_build,
      ]
    uses: ./.github/workflows/deps-update-tag.yaml
    with:
      tag: 'pre-release'

  delete_current_releases:
    name: Delete Current Releases
    needs: [update_tag]
    uses: ./.github/workflows/deps-delete-releases.yaml
    with:
      tag: 'pre-release'

  upload_release_assets:
    name: Upload Release Assets
    needs: [delete_current_releases]
    uses: ./.github/workflows/deps-upload-release-assets.yaml
    with:
      tag: 'pre-release'

  updater:
    name: Create Updater
    needs: [upload_release_assets, verify_sourceforge]
    uses: ./.github/workflows/deps-create-updater.yaml
    with:
      nightly: true
      sourceforge_mirrors_json: ${{ needs.verify_sourceforge.outputs.sourceforge_mirrors_json }}
    secrets: inherit

  telegram:
    name: Send Release Message to Telegram
    if: startsWith(github.repository, 'libnyanpasu')
    needs: [upload_release_assets]
    uses: ./.github/workflows/deps-message-telegram.yaml
    with:
      nightly: true
      tag: 'pre-release'
    secrets: inherit

  verify_sourceforge:
    name: Verify SourceForge Mirror
    if: ${{ always() && (vars.SOURCEFORGE_PROJECT == '' || needs.publish_storage.outputs.publication_prepared == 'true') && needs.check_changes.outputs.should_build == 'true' }}
    needs: [check_changes, publish_storage]
    runs-on: ubuntu-latest
    outputs:
      sourceforge_mirrors_json: ${{ steps.verify.outputs.sourceforge_mirrors_json }}
      sourceforge_build_id: ${{ steps.verify.outputs.sourceforge_build_id }}
      sourceforge_project: ${{ steps.verify.outputs.sourceforge_project }}
    steps:
      - name: Checkout repository
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: actions/checkout@v7
      - name: Install Deno
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Download target publication reports
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: publication-reports-*
          path: ./publication-reports
          merge-multiple: false
      - name: Verify complete mirror and public hashes
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        id: verify
        run: >-
          deno task sourceforge:verify ./publication-reports ./sourceforge-mirrors.json nightly
          windows-x86_64,windows-aarch64,linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64
      - name: Preserve verified mirror manifest
        if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sourceforge-verified-mirrors
          path: ./sourceforge-mirrors.json
          if-no-files-found: error

  verify_archive_uploads:
    name: Verify IA Archive Upload Reports
    if: ${{ always() && needs.publish_storage.outputs.publication_prepared == 'true' && vars.IA_ITEM_PREFIX != '' && needs.check_changes.outputs.should_build == 'true' }}
    needs: [check_changes, publish_storage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Download target publication reports
        uses: actions/download-artifact@v8
        with:
          pattern: publication-reports-*
          path: ./publication-reports
          merge-multiple: false
      - name: Verify complete uploads and report pending ingest
        run: >-
          deno task archive:verify-reports ./publication-reports
          windows-x86_64,windows-aarch64,linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64

  cleanup_sourceforge_nightly:
    name: Clean Previous SourceForge Nightlies
    if: ${{ vars.SOURCEFORGE_PROJECT != '' }}
    needs: [updater, verify_sourceforge]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Retain current build and defer cleanup until old archives are ready
        run: deno task sourceforge:cleanup ./sourceforge-cleanup-report.json
        env:
          SOURCEFORGE_PROJECT: ${{ needs.verify_sourceforge.outputs.sourceforge_project }}
          SOURCEFORGE_BUILD_ID: ${{ needs.verify_sourceforge.outputs.sourceforge_build_id }}
          SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME || secrets.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_KNOWN_HOSTS: ${{ secrets.SOURCEFORGE_KNOWN_HOSTS }}
          IA_ITEM_PREFIX: ${{ vars.IA_ITEM_PREFIX }}
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
      - name: Preserve cleanup report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sourceforge-nightly-cleanup-report
          path: ./sourceforge-cleanup-report.json
          if-no-files-found: error
