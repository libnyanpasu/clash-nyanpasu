[package]
name = 'nyanpasu-os'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
verge-dev = []

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
nyanpasu-paths = { path = '../nyanpasu-paths' }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
anyhow = '1'
async-trait = '0.1.77'
auto-launch = { workspace = true }
camino = '1.1.9'
dunce = '1.0.4'
hex = '0.4'
once_cell = '1.19.0'
reqwest = { workspace = true }
runas = { workspace = true }
serde = { version = '1.0', features = ['derive'] }
sha2 = '0.11'
snafu = { workspace = true }
specta = '^2.0.0-rc.25'
sysinfo = '0.39'
sysproxy = { workspace = true }
tempfile = '3.9.0'
tokio = { workspace = true }
tokio-util = '0.7'
tracing = { workspace = true }
url = '2'
whoami = '2.0.0'

[target.'cfg(windows)'.dependencies]
nyanpasu-utils = { path = '../nyanpasu-runtime/crates/nyanpasu-utils', default-features = false, features = [
  'os'
] }
windows-sys = { version = '0.61', features = ['Win32_UI_WindowsAndMessaging'] }
winreg = { version = '0.56', features = ['transactions'] }

[dev-dependencies]
mockall = '0.15'
futures = '0.3'
serde_json = '1.0'
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false, features = [
  'test-support'
] }
