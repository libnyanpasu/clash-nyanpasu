name: '[Single] Build Windows NSIS'

on:
  workflow_dispatch:
    inputs:
      portable:
        description: 'Build Portable pkg'
        required: true
        type: boolean
        default: false

      bundle-type:
        description: 'Bundle variant'
        required: true
        type: choice
        default: 'standard'
        options:
          - standard
          - fixed-webview
          - both

      nightly:
        description: 'Nightly prepare'
        required: true
        type: boolean
        default: false

      tag:
        description: 'Release Tag'
        required: true
        type: string

      arch:
        type: choice
        description: 'build arch target'
        required: true
        default: 'x86_64'
        options:
          - x86_64
          - aarch64

  workflow_call:
    inputs:
      portable:
        description: 'Build Portable pkg'
        required: true
        type: boolean
        default: false

      bundle-type:
        description: 'Bundle variant: standard | fixed-webview | both'
        required: false
        type: string
        default: 'standard'

      nightly:
        description: 'Nightly prepare'
        required: true
        type: boolean
        default: false

      tag:
        description: 'Release Tag'
        required: true
        type: string

      arch:
        type: string
        description: 'build arch target'
        required: true
        default: 'x86_64'

jobs:
  build:
    runs-on: windows-latest
    env:
      # TODO: Remove after upgrading to a tauri-build release containing tauri-apps/tauri#15831.
      __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: '1'
      NIGHTLY: ${{ inputs.nightly == true && 'true' || 'false' }}
      BUILD_DIR: ${{ inputs.arch == 'aarch64' && 'backend/target/aarch64-pc-windows-msvc/release' || 'backend/target/release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust nightly
        run: |
          rustup install nightly --profile minimal --no-self-update
          rustup default nightly

      - name: Setup Rust target
        if: ${{ inputs.arch != 'x86_64' }}
        run: |
          rustup target add ${{ inputs.arch }}-pc-windows-msvc

      - name: Install Node latest
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        with:
          workspaces: 'backend'
          key: ${{ inputs.arch }}

      - name: Install Node.js dependencies
        run: |
          pnpm i

      - name: Prepare sidecars and resources
        run: |
          $condition = '${{ inputs.arch }}'
          switch ($condition) {
            'x86_64' {
              pnpm prepare:check
            }
            'aarch64' {
              pnpm prepare:check --arch arm64 --sidecar-host aarch64-pc-windows-msvc
            }
          }

      - name: Build frontend packages
        run: |
          pnpm build:packages

      - name: Test Windows bundle layout
        run: deno test --config scripts/deno.jsonc -A scripts/windows-bundle_test.ts

      - name: Set file server folder path
        if: ${{ inputs.nightly == true }}
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "FOLDER_PATH=nightly/${GIT_HASH}" >> $GITHUB_ENV

      - name: Prepare release channel
        run: ${{ inputs.nightly == true && 'pnpm prepare:nightly --nsis' || 'pnpm prepare:release --nsis' }}

      - name: Compile application once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm tauri build --no-bundle ${{ inputs.nightly == true && '-f nightly -c ./backend/tauri/tauri.nightly.conf.json' || '-f default-meta' }} ${{ inputs.arch == 'aarch64' && '--target aarch64-pc-windows-msvc' || '' }}

      - name: Bundle standard NSIS installer
        if: ${{ inputs.bundle-type != 'fixed-webview' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          pnpm tauri bundle --bundles nsis ${{ inputs.nightly == true && '-f nightly -c ./backend/tauri/tauri.nightly.conf.json' || '-f default-meta' }} ${{ inputs.arch == 'aarch64' && '--target aarch64-pc-windows-msvc' || '' }}

      - name: Portable Bundle
        if: ${{ inputs.portable == true && inputs.bundle-type != 'fixed-webview' }}
        run: |
          pnpm portable
        env:
          RUST_ARCH: ${{ inputs.arch }}
          VITE_WIN_PORTABLE: 1

      - name: Upload NSIS Installer
        if: ${{ inputs.bundle-type != 'fixed-webview' }}
        uses: actions/upload-artifact@v7
        with:
          name: Clash.Nyanpasu-windows-${{ inputs.arch }}-nsis-installer
          path: |
            ./backend/target/**/bundle/**/*.exe
            ./backend/target/**/bundle/**/*.zip
            ./backend/target/**/bundle/**/*.zip.sig

      - name: Upload portable
        if: ${{ inputs.portable == true && inputs.bundle-type != 'fixed-webview' }}
        uses: actions/upload-artifact@v7
        with:
          name: Clash.Nyanpasu-windows-${{ inputs.arch }}-portable
          path: |
            ./*_portable.zip

      - name: Upload to file server
        if: ${{ inputs.nightly == true && inputs.bundle-type != 'fixed-webview' }}
        shell: bash
        continue-on-error: true
        run: |
          deno run -A scripts/upload-build-artifacts.ts \
            "backend/target/**/bundle/nsis/*.exe" \
            "*_portable.zip"
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          FOLDER_PATH: ${{ env.FOLDER_PATH }}

      - name: Upload file server results
        if: ${{ inputs.nightly == true && inputs.bundle-type != 'fixed-webview' }}
        uses: actions/upload-artifact@v7
        with:
          name: upload-results-windows-${{ inputs.arch }}
          path: ./upload-results.json
          if-no-files-found: ignore

      - name: Clean standard bundle outputs
        if: ${{ inputs.bundle-type == 'both' }}
        run: |
          Remove-Item -LiteralPath "$env:BUILD_DIR/bundle" -Recurse -Force
          Get-ChildItem -Path "." -Filter "*_portable.zip" -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Remove-Item -Path "./upload-results.json" -Force -ErrorAction SilentlyContinue

      - name: Download fixed WebView
        if: ${{ inputs.bundle-type != 'standard' }}
        run: |
          $condition = '${{ inputs.arch }}'
          switch ($condition) {
            'x86_64' {
              $arch= 'x64'
            }
            'aarch64' {
              $arch = 'arm64'
            }
          }

          $version = '127.0.2651.105'
          $uri = "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/Microsoft.WebView2.FixedVersionRuntime.$version.$arch.cab"
          $outfile = "Microsoft.WebView2.FixedVersionRuntime.$version.$arch.cab"
          echo "Downloading $uri to $outfile"
          invoke-webrequest -uri $uri -outfile $outfile
          echo "Download finished, attempting to extract"
          $extractDir = './backend/tauri/tmp/windows-bundle/download'
          New-Item -ItemType Directory -Force $extractDir | Out-Null
          expand.exe $outfile -F:* $extractDir
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract fixed WebView2' }
          Move-Item -LiteralPath "$extractDir/Microsoft.WebView2.FixedVersionRuntime.$version.$arch" -Destination './backend/tauri/WebView2'
          echo "Extraction finished"

      - name: Bundle fixed WebView NSIS installer
        if: ${{ inputs.bundle-type != 'standard' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          pnpm tauri bundle --bundles nsis ${{ inputs.nightly == true && '-f nightly -c ./backend/tauri/tauri.nightly.conf.json' || '-f default-meta' }} ${{ inputs.arch == 'aarch64' && '--target aarch64-pc-windows-msvc' || '' }} -c ./backend/tauri/overrides/fixed-webview2.conf.json

      - name: Rename fixed webview bundle name
        if: ${{ inputs.bundle-type != 'standard' }}
        run: |
          $files = Get-ChildItem -Path "./backend/target" -Recurse -Include "*.exe", "*.zip", "*.zip.sig" | Where-Object { $_.FullName -like "*\bundle\*" }
          $condition = '${{ inputs.arch }}'
          switch ($condition) {
            'x86_64' {
              $arch= 'x64'
            }
            'aarch64' {
              $arch = 'arm64'
            }
          }

          foreach ($file in $files) {
            echo "Renaming $file"
            $newname = $file.FullName -replace $arch, "fixed-webview-$arch"
            Rename-Item -Path $file -NewName $newname
          }

      - name: Portable Bundle with fixed WebView
        if: ${{ inputs.portable == true && inputs.bundle-type != 'standard' }}
        run: |
          pnpm portable --fixed-webview
        env:
          RUST_ARCH: ${{ inputs.arch }}
          VITE_WIN_PORTABLE: 1

      - name: Upload NSIS Installer with fixed WebView
        if: ${{ inputs.bundle-type != 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: Clash.Nyanpasu-windows-${{ inputs.arch }}-fixed-webview-nsis-installer
          path: |
            ./backend/target/**/bundle/**/*.exe
            ./backend/target/**/bundle/**/*.zip
            ./backend/target/**/bundle/**/*.zip.sig

      - name: Upload portable with fixed WebView
        if: ${{ inputs.portable == true && inputs.bundle-type != 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: Clash.Nyanpasu-windows-${{ inputs.arch }}-fixed-webview-portable
          path: |
            ./*_portable.zip

      - name: Upload to file server with fixed WebView
        if: ${{ inputs.nightly == true && inputs.bundle-type != 'standard' }}
        shell: bash
        continue-on-error: true
        run: |
          deno run -A scripts/upload-build-artifacts.ts \
            "backend/target/**/bundle/nsis/*.exe" \
            "*_portable.zip"
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          FOLDER_PATH: ${{ env.FOLDER_PATH }}

      - name: Upload file server results with fixed WebView
        if: ${{ inputs.nightly == true && inputs.bundle-type != 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: upload-results-windows-${{ inputs.arch }}-fixed-webview
          path: ./upload-results.json
          if-no-files-found: ignore
