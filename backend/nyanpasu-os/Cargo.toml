[package]
name = 'nyanpasu-os'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The network automation observer; a shell that offers it enables this.
network-environment = [
  'dep:netdev',
  'dep:zbus',
  'dep:dispatch2',
  'dep:objc2',
  'dep:objc2-core-location',
  'dep:objc2-core-wlan',
  'dep:objc2-foundation'
]
test-support = []
verge-dev = []

[dependencies]
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
nyanpasu-paths = { path = '../nyanpasu-paths' }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
anyhow = '1'
async-trait = '0.1.77'
auto-launch = { workspace = true }
camino = '1.1.9'
dunce = '1.0.4'
getrandom = '0.4'
hex = '0.4'
if-addrs = '0.15'
ipnet = '2.12'
netdev = { version = '0.47', default-features = false, features = ['gateway'], optional = true }
once_cell = '1.19.0'
rcgen = { version = '0.14', default-features = false, features = [
  'aws_lc_rs',
  'x509-parser'
] }
reqwest = { workspace = true }
rustls-pki-types = '1'
runas = { workspace = true }
serde = { version = '1.0', features = ['derive'] }
sha2 = '0.11'
snafu = { workspace = true }
specta = '^2.0.0-rc.28'
sysinfo = '0.40'
sysproxy = { workspace = true }
tempfile = '3.9.0'
time = '0.3'
tokio = { workspace = true }
tokio-util = '0.7'
tracing = { workspace = true }
url = '2'
whoami = '2.0.0'
zeroize = '1.8'

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = '6', optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = '0.3', default-features = false, features = ['std'], optional = true }
objc2 = { version = '0.6', optional = true }
objc2-core-location = { version = '0.3', default-features = false, features = [
  'std',
  'CLLocationManager'
], optional = true }
objc2-core-wlan = { version = '0.3', default-features = false, features = [
  'CWInterface',
  'CWWiFiClient'
], optional = true }
objc2-foundation = { version = '0.3', default-features = false, features = [
  'std',
  'NSString'
], optional = true }

[target.'cfg(windows)'.dependencies]
nyanpasu-utils = { path = '../nyanpasu-runtime/crates/nyanpasu-utils', default-features = false, features = [
  'os'
] }
windows-sys = { version = '0.61', features = [
  'Win32_Foundation',
  'Win32_NetworkManagement_WiFi',
  'Win32_UI_WindowsAndMessaging'
] }
winreg = { version = '0.56', features = ['transactions'] }

[dev-dependencies]
mockall = '0.15'
rustls = '0.23'
tokio-rustls = '0.26'
futures = '0.3'
serde_json = '1.0'
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false, features = [
  'test-support'
] }
