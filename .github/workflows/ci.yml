on:
  pull_request:
    branches:
      - main
      - dev
      - release-*
  push:
    branches:
      - main
      - dev
      - release-*

# the name of our workflow
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    strategy:
      matrix:
        targets:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.targets.os }}
    steps:
      # The nyanpasu-runtime submodule pins `newline_style = "Unix"` in its own
      # rustfmt.toml, but its .gitattributes is only `* text=auto`. Without this,
      # Windows checks the submodule out with CRLF and `lint:rustfmt` rejects every
      # file in it. The submodule's own workflows set the same two options before
      # checkout; the superproject has to do it too now that it vendors the crates.
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          # `backend/nyanpasu-runtime` is a submodule that itself nests
          # `crates/nyanpasu-utils`; `true` would leave that inner path empty.
          submodules: recursive
      - name: Rust
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup default nightly
          rustup component add clippy rustfmt
          rustc --version
          cargo --version
          rustup show

      - name: Tauri dependencies
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-3-dev
          libayatana-appindicator3-dev
          libwebkit2gtk-4.1-dev
          librsvg2-dev
          libxdo-dev
          webkit2gtk-driver
          xvfb

      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(matrix.targets.os, 'macos-')
        with:
          xcode-version: 'latest-stable'

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        with:
          workspaces: 'backend'
          save-if: ${{ github.event_name == 'push' }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          save-always: ${{ github.event_name == 'push' }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare fronend
        run: pnpm -r build # Build frontend
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
      - name: Prepare sidecar and resources
        run: pnpm prepare:check
      - name: Lint
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: pnpm lint # Lint
      - name: Lint
        if: startsWith(matrix.targets.os, 'ubuntu-') == false
        run: pnpm run-p lint:clippy lint:rustfmt # Lint
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

  # TODO: support test cross-platform
  build:
    name: Build Tauri
    strategy:
      matrix:
        targets:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
      fail-fast: false
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.title, 'crate') ||
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ${{ matrix.targets.os }}
    needs: lint
    steps:
      # Same reason as the lint job: the submodule must not arrive with CRLF.
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Tauri dependencies
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-3-dev
          libayatana-appindicator3-dev
          libwebkit2gtk-4.1-dev
          librsvg2-dev
          libxdo-dev
          webkit2gtk-driver
          xvfb
      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(matrix.targets.os, 'macos-')
        with:
          xcode-version: 'latest-stable'

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        with:
          workspaces: 'backend'
          save-if: ${{ github.event_name == 'push' }}

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          save-always: ${{ github.event_name == 'push' }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare sidecar and resources
        run: pnpm prepare:check

      - name: Prepare frontend
        run: pnpm -r build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Build Backend
        run: cargo build --release --manifest-path backend/Cargo.toml

  test_unit:
    name: Unit Test
    needs: lint
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.title, 'crate') ||
      github.event.pull_request.user.login != 'renovate[bot]'

    # we want to run on the latest linux environment
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # the steps our job runs **in order**
    steps:
      # Same reason as the lint job: the submodule must not arrive with CRLF.
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      # checkout the code on the workflow runner
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # install system dependencies that Tauri needs to compile on Linux.
      # note the extra dependencies for `tauri-driver` to run which are: `webkit2gtk-driver` and `xvfb`
      - name: Tauri dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-3-dev
          libayatana-appindicator3-dev
          libwebkit2gtk-4.1-dev
          librsvg2-dev
          libxdo-dev
          webkit2gtk-driver
          xvfb

      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(matrix.os, 'macos-')
        with:
          xcode-version: 'latest-stable'

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        with:
          workspaces: 'backend'
          save-if: ${{ github.event_name == 'push' }}

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          save-always: ${{ github.event_name == 'push' }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare sidecar and resources
        run: pnpm prepare:check

      - name: Prepare frontend
        run: pnpm -r build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Free up disk space
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Test
        run: pnpm test

      - name: Check typescript bindings freshness
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- frontend/interface/src/ipc/bindings.ts
