[package]
name = 'nyanpasu-geodata'
version = '0.1.0'
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aho-corasick = '1'
bytemuck = { version = '1', features = ['derive'] }
crc32fast = '1'
fst = '0.4'
maxminddb = '0.32'
memmap2 = '0.9'
regex-automata = { version = '0.4', default-features = false, features = [
  'std',
  'syntax',
  'unicode',
  'meta',
  'nfa-pikevm',
  'nfa-backtrack',
  'hybrid',
  'dfa-onepass',
  'perf-inline',
  'perf-literal',
] }
serde = { version = '1', features = ['derive'] }
thiserror.workspace = true

[dev-dependencies]
regex = '1'
tempfile = '3'
