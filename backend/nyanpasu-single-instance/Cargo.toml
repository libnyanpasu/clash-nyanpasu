[package]
name = 'nyanpasu-single-instance'
version = '0.1.0'
description = 'User-private local endpoints with first-binder ownership, shared by the desktop, server and CLI'
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
interprocess = { workspace = true, features = ['tokio'] }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
sha2 = '0.11'
snafu = { workspace = true }
tokio = { version = '1', features = ['io-util', 'rt', 'sync', 'time'] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = '0.2'
socket2 = '0.6'

[target.'cfg(windows)'.dependencies]
widestring = '1'
windows-sys = { version = '0.61', features = [
  'Win32_Foundation',
  'Win32_Security',
  'Win32_Security_Authorization',
  'Win32_System_Threading',
  'Win32_UI_WindowsAndMessaging',
] }

[dev-dependencies]
tempfile = '3.9.0'
tokio = { workspace = true }
