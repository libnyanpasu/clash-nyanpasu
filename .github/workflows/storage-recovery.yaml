name: '[Maintenance] Debug and Recover Storage Publication'

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed nightly/release run with retained artifacts and publication-reports-central'
        required: true
        type: string
      telegram_report_run_id:
        description: 'Run containing saved Telegram receipts (defaults to source_run_id)'
        required: false
        type: string
      mode:
        description: 'Preflight only, Telegram registration only, upload and verify, or verification only'
        required: true
        type: choice
        default: preflight
        options: [preflight, register, upload, verify]
      backend:
        description: 'Storage backend to investigate or recover'
        required: true
        type: choice
        default: both
        options: [both, telegram, sourceforge]
      target:
        description: 'Target to recover (all inventories are validated before any writes)'
        required: true
        type: choice
        default: all
        options:
          [
            all,
            windows-x86_64,
            windows-aarch64,
            linux-x86_64,
            linux-aarch64,
            macos-x86_64,
            macos-aarch64,
          ]

permissions:
  actions: read
  contents: read

jobs:
  recover:
    name: ${{ inputs.mode }} retained ${{ matrix.backend }} publication
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backend == 'both' && inputs.mode != 'register' && '["sourceforge","telegram"]' || inputs.backend == 'sourceforge' && '["sourceforge"]' || '["telegram"]') }}
    concurrency:
      group: storage-publication-${{ matrix.backend }}
      cancel-in-progress: false
    env:
      SOURCEFORGE_PROJECT: ${{ matrix.backend != 'telegram' && inputs.mode != 'register' && vars.SOURCEFORGE_PROJECT || '' }}
      SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME || secrets.SOURCEFORGE_USERNAME }}
      SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
      SOURCEFORGE_KNOWN_HOSTS: ${{ secrets.SOURCEFORGE_KNOWN_HOSTS }}
      ORIGINAL_ITEM_PREFIX: ${{ vars.IA_ITEM_PREFIX || 'sourceforge-only' }}
      ARCHIVE_UPLOAD_TOKEN: ${{ secrets.ARCHIVE_UPLOAD_TOKEN }}
      FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
      UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TO: ${{ matrix.backend == 'telegram' && '@ClashNyanpasu' || '' }}
      TELEGRAM_REPORT_RUN_ID: ${{ inputs.telegram_report_run_id || inputs.source_run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RECOVERY_MODE: ${{ inputs.mode }}
      RECOVERY_BACKEND: ${{ matrix.backend }}
      RECOVERY_TARGET: ${{ inputs.target }}
    steps:
      - name: Checkout current recovery scripts
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check selected backend configuration and connectivity
        run: |
          if [[ "$RECOVERY_BACKEND" == 'sourceforge' && -z "$SOURCEFORGE_PROJECT" ]]; then
            echo 'SOURCEFORGE_PROJECT must be configured for SourceForge recovery' >&2
            exit 1
          fi
          deno task storage:preflight

      - name: Read source run provenance
        if: ${{ inputs.mode != 'preflight' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid source run ID' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json

      - name: Download retained finalized packages
        if: ${{ inputs.mode != 'preflight' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: Clash.Nyanpasu-*
          path: downloaded-build-artifacts
          merge-multiple: false

      - name: Download original publication identity and manifests
        if: ${{ inputs.mode != 'preflight' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: publication-reports-central
          path: previous-publication

      - name: Recover original identity and compare every retained file hash
        if: ${{ inputs.mode != 'preflight' }}
        run: |
          deno task recover:central-publication \
            --source-run source-run.json \
            --artifacts-dir downloaded-build-artifacts \
            --previous-dir previous-publication/central-publication \
            --output-dir central-publication \
            --item-prefix "$ORIGINAL_ITEM_PREFIX"

      - name: Restore saved Telegram upload receipts
        if: ${{ inputs.mode != 'preflight' && matrix.backend == 'telegram' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPLICIT_RECEIPT_RUN: ${{ inputs.telegram_report_run_id }}
        run: |
          [[ "$TELEGRAM_REPORT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TELEGRAM_REPORT_RUN_ID/artifacts" --paginate --slurp --jq '[.[] | .artifacts[] | select((.name | contains("telegram")))] | length')
          if [[ "$count" == '0' ]]; then
            if [[ -n "$EXPLICIT_RECEIPT_RUN" || "$RECOVERY_MODE" != 'upload' ]]; then
              echo 'Saved Telegram receipts are required for this operation' >&2
              exit 1
            fi
            echo 'No previous Telegram upload receipts; starting the first transfer'
          else
            gh run download "$TELEGRAM_REPORT_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*telegram*' --dir previous-telegram
            mapfile -t reports < <(find previous-telegram -name telegram-report.json -type f)
            [[ "${#reports[@]}" == '1' ]] || { echo 'Expected exactly one Telegram receipt report' >&2; exit 1; }
            mkdir -p recovery-reports
            cp "${reports[0]}" recovery-reports/telegram-report.json
          fi

      - name: Run selected recovery operation
        if: ${{ inputs.mode != 'preflight' }}
        run: |
          deno task storage:recover --mode "$RECOVERY_MODE" \
            --backend "$RECOVERY_BACKEND" --target "$RECOVERY_TARGET" \
            --publication-dir central-publication --reports-dir recovery-reports

      - name: Retain recovery diagnostics and immutable inventories
        if: ${{ always() && inputs.mode != 'preflight' }}
        uses: actions/upload-artifact@v7
        with:
          name: storage-recovery-${{ inputs.source_run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}
          overwrite: true
          path: |
            recovery-reports/
            central-publication/manifests/
            central-publication/publication-context.json
            source-run.json
          if-no-files-found: warn
