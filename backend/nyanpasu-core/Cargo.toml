[package]
name = 'nyanpasu-core'
version = '0.1.0'
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default-meta = [
  'nyanpasu-config/default-meta',
  'nyanpasu-migration/default-meta'
]
default = ['default-meta', 'nesting']
nesting = ['nyanpasu-config/nesting', 'struct-patch/nesting']
verge-dev = []
test-support = [
  'dep:mockall',
  'dep:axum',
  'nyanpasu-contracts/test-support',
  'nyanpasu-migration/test-support',
  'nyanpasu-observers/test-support',
  'nyanpasu-updater/test-support',
  'nyanpasu-profile-transform/test-support'
]

[dependencies]
nyanpasu-updater = { path = '../nyanpasu-updater', default-features = false }
nyanpasu-observers = { path = '../nyanpasu-observers', default-features = false }
nyanpasu-owner-support = { path = '../nyanpasu-owner-support', default-features = false }
nyanpasu-migration = { path = '../nyanpasu-migration', default-features = false }
nyanpasu-persistence = { path = '../nyanpasu-persistence', default-features = false }
nyanpasu-profile-transform = { path = '../nyanpasu-profile-transform', default-features = false }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false }
nyanpasu-jobs = { path = '../nyanpasu-runtime/crates/nyanpasu-jobs', features = [
  'specta'
] }
nyanpasu-logging = { path = '../nyanpasu-runtime/crates/nyanpasu-logging', features = [
  'specta'
] }
struct-patch = '0.14'
postcard = { version = '1.1', features = ['alloc'] }
bytes = { version = '1', features = ['serde'] }
nanoid = '0.5.0'
seahash = { version = '4.1', features = ['use_std'] }
nyanpasu-tsdb = { path = '../nyanpasu-tsdb', features = ['redb'] }
nyanpasu-traffic = { path = '../nyanpasu-traffic', features = [
  'specta',
  'legacy-redb'
] }
nyanpasu-diagnose = { path = '../nyanpasu-diagnose' }
nyanpasu-geodata = { path = '../nyanpasu-geodata' }
memmap2 = '0.9'
notify-debouncer-full = '0.7.0'
zstd = '0.14.0'
tempfile = '3.9.0'
nyanpasu-core-manager = { workspace = true }
clash-api = { workspace = true }
futures-util = '0.3'
axum = { version = '0.8', features = ['ws'], optional = true }
redb = '4.0.0'
chrono = { version = '0.4', features = ['serde'] }
time = { version = '0.3', features = ['formatting', 'parsing', 'serde'] }
uuid = '1.7.0'
nyanpasu-macro = { path = '../nyanpasu-macro' }
nyanpasu-ipc = { workspace = true }
nyanpasu-utils = { workspace = true, features = ['atomic_fs', 'redb'] }
semver = '1.0'
parking_lot = { version = '0.13.0' }
mockall = { version = '0.15', optional = true }
nyanpasu-paths = { path = '../nyanpasu-paths' }
tokio-util = { version = '0.7', features = ['full'] }
ractor = '0.16'
futures = '0.3'
url = '2'
sha2 = '0.11'
hex = '0.4'
serde_json = { version = '1.0', features = ['preserve_order'] }
tracing-attributes = '0.1'
nyanpasu-config = { path = '../nyanpasu-config', default-features = false, features = [
  'nesting'
] }
specta = { version = '^2.0.0-rc.25', features = [
  'serde_json',
  'serde_yaml',
  'uuid',
  'url',
  'indexmap'
] }
snafu = { workspace = true }
strum = { version = '0.28', features = ['derive'] }
anyhow = '1'
bon = '3'
arc-swap = '1'
async-trait = '0.1'
dashmap = '6'
indexmap = { version = '2.2.3', features = ['serde'] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde = { version = '1.0', features = ['derive', 'rc'] }
atomicwrites = '0.4.4'
camino = { version = '1.1.9', features = ['serde1'] }
fs-err = { workspace = true }
serde_yaml_ng = { workspace = true }

[target.'cfg(not(target_env = "musl"))'.dev-dependencies]
# The desktop AES smoke test does not apply to generic router/musl targets.
# Currently exercised only by the gxhash smoke test below. Every distributed
# target now guarantees hardware AES (see ../../.cargo/config.toml; i686 was
# dropped in #4908), so gxhash can graduate to a normal dependency once the
# default HashMap hasher is migrated to it.
gxhash = { workspace = true }

[dev-dependencies]
nyanpasu-updater = { path = '../nyanpasu-updater', default-features = false, features = [
  'test-support'
] }
nyanpasu-observers = { path = '../nyanpasu-observers', default-features = false, features = [
  'test-support'
] }
nyanpasu-migration = { path = '../nyanpasu-migration', default-features = false, features = [
  'test-support'
] }
nyanpasu-net = { path = '../nyanpasu-net', default-features = false }
nyanpasu-profile-io = { path = '../nyanpasu-profile-io', default-features = false }
nyanpasu-profile-transform = { path = '../nyanpasu-profile-transform', default-features = false, features = [
  'test-support'
] }
nyanpasu-contracts = { path = '../nyanpasu-contracts', default-features = false, features = [
  'test-support'
] }
tracing-subscriber = { version = '0.3', features = [
  'env-filter',
  'json',
  'parking_lot'
] }
pretty_assertions = '1.4.0'
mockall = '0.15'
axum = { version = '0.8', features = ['ws'] }
nyanpasu-paths = { path = '../nyanpasu-paths' }
serde_json = { version = '1', features = ['preserve_order'] }
tokio = { workspace = true, features = ['full', 'test-util'] }
tempfile = '3'
